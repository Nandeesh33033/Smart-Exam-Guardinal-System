version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - '5000:5000'
    depends_on:
      - mongo
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
